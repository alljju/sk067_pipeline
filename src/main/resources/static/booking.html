<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 정보 입력 - ParkHub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page-header">
        <div class="container">
            <div class="header-content">
                <a href="search.html" class="btn-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <h1 class="header-title">예약 정보 입력</h1>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="booking-container">
            <div class="card">
                <h2 class="card-title">주차장 정보</h2>
                <div class="parking-info">
                    <h3 class="parking-name" id="parkingName"></h3>
                    <div class="parking-address">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <span id="parkingAddress"></span>
                    </div>
                    <div class="features-list" id="featuresList"></div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">예약 일시</h2>
                <div class="booking-time-info">
                    <div class="info-row">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <div>
                            <div class="info-label">날짜</div>
                            <div class="info-value" id="bookingDate"></div>
                        </div>
                    </div>
                    <div class="info-row">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                        <div>
                            <div class="info-label">시간</div>
                            <div class="info-value" id="bookingTime"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">차량 정보</h2>
                <form id="bookingForm" class="booking-form">
                    <div class="form-group">
                        <label for="licensePlate" class="form-label">차량 번호</label>
                        <input type="text" id="licensePlate" class="form-input" placeholder="예: 12가3456" required>
                    </div>

                    <div class="form-group">
                        <label for="vehicleType" class="form-label">차량 종류</label>
                        <select id="vehicleType" class="form-input" required>
                            <option value="sedan">승용차</option>
                            <option value="suv">SUV</option>
                            <option value="van">승합차</option>
                        </select>
                    </div>

                    <div class="form-divider"></div>

                    <h2 class="card-title">예약자 정보</h2>

                    <div class="form-group">
                        <label for="userName" class="form-label">이름</label>
                        <input type="text" id="userName" class="form-input" placeholder="홍길동" required>
                    </div>

                    <div class="form-group">
                        <label for="userPhone" class="form-label">연락처</label>
                        <input type="tel" id="userPhone" class="form-input" placeholder="010-1234-5678" required>
                    </div>

                    <div class="form-divider"></div>

                    <div class="payment-summary">
                        <div class="payment-row">
                            <span class="payment-label">주차 요금</span>
                            <span class="payment-value" id="priceDetail"></span>
                        </div>
                        <div class="form-divider"></div>
                        <div class="payment-row payment-total">
                            <span class="payment-total-label">총 결제 금액</span>
                            <span class="payment-total-value" id="totalAmount"></span>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                            <line x1="1" y1="10" x2="23" y2="10"></line>
                        </svg>
                        결제하고 예약하기
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
