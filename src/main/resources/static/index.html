<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkHub - 주차장 예약 서비스</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="page-container">
        <div class="hero-section">
            <div class="container">
                <div class="hero-content">
                    <div class="hero-header">
                        <div class="logo-container">
                            <div class="logo-icon">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"></path>
                                    <polygon points="12 15 17 21 7 21 12 15"></polygon>
                                </svg>
                            </div>
                            <h1 class="logo-text">ParkHub</h1>
                        </div>
                        <p class="hero-subtitle">빠르고 편리한 주차장 예약 서비스</p>
                    </div>

                    <div class="search-card">
                        <form id="searchForm" class="search-form">
                            <div class="form-group">
                                <label for="location" class="form-label">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                        <circle cx="12" cy="10" r="3"></circle>
                                    </svg>
                                    위치
                                </label>
                                <input type="text" id="location" class="form-input" placeholder="주차장 위치를 입력하세요" value="강남역" required>
                            </div>

                            <div class="form-group">
                                <label for="date" class="form-label">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                    날짜
                                </label>
                                <input type="date" id="date" class="form-input" required>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="startTime" class="form-label">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <polyline points="12 6 12 12 16 14"></polyline>
                                        </svg>
                                        시작 시간
                                    </label>
                                    <input type="time" id="startTime" class="form-input" value="10:00" required>
                                </div>

                                <div class="form-group">
                                    <label for="endTime" class="form-label">종료 시간</label>
                                    <input type="time" id="endTime" class="form-input" value="18:00" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-large">주차장 검색</button>
                        </form>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value">500+</div>
                            <div class="stat-label">제휴 주차장</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">10만+</div>
                            <div class="stat-label">누적 예약</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">4.8</div>
                            <div class="stat-label">평균 평점</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
