<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 완료 - ParkHub</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="confirmation-page">
        <div class="container">
            <div class="confirmation-container">
                <div class="confirmation-header">
                    <div class="success-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                    </div>
                    <h1 class="confirmation-title">예약이 완료되었습니다!</h1>
                    <p class="confirmation-subtitle">예약 정보를 확인해주세요</p>
                </div>

                <div class="card">
                    <div class="booking-id-section">
                        <div class="booking-id-label">예약 번호</div>
                        <div class="booking-id-value" id="bookingId"></div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="confirmation-section">
                        <h2 class="section-title">주차장 정보</h2>
                        <div class="info-row">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            <div>
                                <div class="info-value" id="confirmParkingName"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="confirmation-section">
                        <h2 class="section-title">예약 일시</h2>
                        <div class="info-row">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            <div>
                                <div class="info-label">날짜</div>
                                <div class="info-value" id="confirmDate"></div>
                            </div>
                        </div>
                        <div class="info-row">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                            <div>
                                <div class="info-label">시간</div>
                                <div class="info-value" id="confirmTime"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="confirmation-section">
                        <h2 class="section-title">차량 및 예약자 정보</h2>
                        <div class="info-row">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-1"></path>
                                <polygon points="12 15 17 21 7 21 12 15"></polygon>
                            </svg>
                            <div>
                                <div class="info-label">차량 번호</div>
                                <div class="info-value" id="confirmLicensePlate"></div>
                            </div>
                        </div>
                        <div class="info-row">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <div>
                                <div class="info-label">예약자</div>
                                <div class="info-value" id="confirmUserName"></div>
                            </div>
                        </div>
                        <div class="info-row">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                            <div>
                                <div class="info-label">연락처</div>
                                <div class="info-value" id="confirmUserPhone"></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="payment-summary">
                        <div class="payment-row payment-total">
                            <span class="payment-total-label">결제 금액</span>
                            <span class="payment-total-value" id="confirmTotalAmount"></span>
                        </div>
                    </div>
                </div>

                <div class="confirmation-actions">
                    <a href="index.html" class="btn btn-primary btn-large">홈으로 돌아가기</a>
                    <button class="btn btn-outline btn-large">예약 내역 보기</button>
                </div>

                <div class="confirmation-notice">
                    <p>예약 정보는 문자 메시지로 발송되었습니다.<br>주차장 입차 시 예약 번호를 제시해주세요.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/confirmation.js"></script>
</body>
</html>
